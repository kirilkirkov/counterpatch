[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counterpatch"
version = "0.1.0"
description = "Adversarial regression testing for AI-generated and human code patches. Finds and minimizes reproducible counterexamples using pytest and Hypothesis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CounterPatch contributors" }]
keywords = [
    "regression-testing",
    "adversarial-testing",
    "differential-testing",
    "property-based-testing",
    "hypothesis",
    "pytest",
    "ai-generated-code",
    "code-review",
    "github-actions",
    "ci",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Hypothesis",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "hypothesis>=6.100",
    "pytest>=7.4",
]

[project.optional-dependencies]
ai = ["anthropic>=0.75"]
dev = ["anthropic>=0.75", "ruff>=0.6"]

[project.scripts]
counterpatch = "counterpatch.cli:main"

[project.urls]
# Replace OWNER with the GitHub account or organization that hosts the repository.
Homepage = "https://github.com/OWNER/counterpatch"
Repository = "https://github.com/OWNER/counterpatch"
Issues = "https://github.com/OWNER/counterpatch/issues"

[tool.setuptools]
packages = ["counterpatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501", "B905"]
